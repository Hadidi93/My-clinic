# The iPhone app's Xcode project, described in text. The .xcodeproj is made
# from this file by XcodeGen (on GitHub's Mac, or on a Mac: `brew install
# xcodegen && cd iosApp && xcodegen generate`). The app itself is the shared
# Kotlin code (framework "Shared"); this project only adds the iPhone shell.
name: MyClinic
options:
  bundleIdPrefix: com.myclinic
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  MyClinic:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: My Clinic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Email links (verify / reset password) open the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.myclinic.app.auth
            CFBundleURLSchemes: [myclinic]
        NSCameraUsageDescription: My Clinic uses the camera to photograph lab reports, X-rays and wounds for the patient's record.
        NSPhotoLibraryUsageDescription: My Clinic lets you attach a photo from your library to a patient's record.
        NSFaceIDUsageDescription: My Clinic uses Face ID to keep patient records locked when you are away.
        SupabaseUrl: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myclinic.app
        PRODUCT_NAME: MyClinic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lsqlite3]
    preBuildScripts:
      - name: Build the shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
