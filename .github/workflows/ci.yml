# Runs on every push and pull request:
#   1. database-security: applies the Supabase migrations to a throw-away
#      PostgreSQL and runs the Row-Level Security tests.
#   2. android: runs all unit tests and builds a debug APK you can download
#      from the run's "Artifacts" section and install on a test phone.
name: CI

on:
  push:
  pull_request:
  # Adds a "Run workflow" button on the Actions page, e.g. to rebuild the
  # test app after changing the Supabase secrets.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run security tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/tests/run_local.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        env:
          # Optional repository secrets. Without them the APK builds but
          # points at a placeholder server.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: the text of google-services.json (push notifications).
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: ./gradlew :core:domain:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Play Store bundle (only when the upload key secrets are set)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No upload key configured: skipping the Play Store bundle."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: my-clinic-play-store-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload release APK (for the release smoke test)
        uses: actions/upload-artifact@v4
        with:
          name: my-clinic-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-clinic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  # Starts the app on an Android emulator and fails if it crashes on launch.
  launch-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: my-clinic-debug-apk
          path: app-apk
      - uses: actions/download-artifact@v4
        with:
          name: my-clinic-release-apk
          path: release-apk
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The test build, then the shrunk/obfuscated release build (catches missing keep rules).
          script: .github/scripts/smoke-test.sh app-apk && adb uninstall com.myclinic.app && .github/scripts/smoke-test.sh release-apk
      - name: Upload device log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-test-log
          path: |
            logcat.txt
            screen.png
            ui.xml
          retention-days: 14
