# Runs on every push and pull request:
#   1. database-security: applies the Supabase migrations to a throw-away
#      PostgreSQL and runs the Row-Level Security tests.
#   2. android: runs all unit tests and builds a debug APK you can download
#      from the run's "Artifacts" section and install on a test phone.
#   3. ios: compiles the shared code for iPhone on a Mac (no Mac needed on your side).
name: CI

on:
  push:
  pull_request:
  # Adds a "Run workflow" button on the Actions page, e.g. to rebuild the
  # test app after changing the Supabase secrets.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run security tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/tests/run_local.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        env:
          # Optional repository secrets. Without them the APK builds but
          # points at a placeholder server.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: the text of google-services.json (push notifications).
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -o pipefail
          ./gradlew :core:domain:jvmTest :shared:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Show compile errors as annotations
        if: failure()
        run: .github/scripts/annotate-errors.sh build.log
      - name: Play Store bundle (only when the upload key secrets are set)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No upload key configured: skipping the Play Store bundle."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: my-clinic-play-store-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload release APK (for the release smoke test)
        uses: actions/upload-artifact@v4
        with:
          name: my-clinic-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-clinic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  # The shared code (rules, and later data and screens) compiled for iPhone.
  # Mac minutes count 10x against GitHub's free allowance, so this job stays short.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Compile shared code for iPhone and the iPhone simulator
        run: |
          set -o pipefail
          ./gradlew :core:domain:compileKotlinIosArm64 :core:domain:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 2>&1 | tee build.log
      - name: Build the iPhone app (simulator)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          brew install xcodegen
          # "//" starts a comment in .xcconfig files, so the URL is written as https:/$()/...
          if [ -n "$SUPABASE_URL" ]; then
            printf 'SUPABASE_URL = %s\nSUPABASE_ANON_KEY = %s\n' "${SUPABASE_URL/\/\//\/\$()\/}" "$SUPABASE_ANON_KEY" > iosApp/Config.xcconfig
          fi
          cd iosApp && xcodegen generate
          xcodebuild -project MyClinic.xcodeproj -scheme MyClinic -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|warning: .*Swift|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/MyClinic.app
      - name: Launch the iPhone app in a simulator
        run: .github/scripts/ios-smoke-test.sh iosApp/build/Build/Products/Debug-iphonesimulator/MyClinic.app
      - name: Upload iPhone screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: |
            ios-screen.png
            ios-log.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: TestFlight upload (only when the App Store Connect secrets are set)
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "No App Store Connect key configured: skipping the TestFlight upload."
            exit 0
          fi
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 -d > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          cd iosApp
          # Signed with Apple's automatic signing; each run gets a new build number.
          xcodebuild -project MyClinic.xcodeproj -scheme MyClinic -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/MyClinic.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${auth[@]}" archive 2>&1 | tee ../build.log | grep -E "error:|ARCHIVE" || true
          test -d build/MyClinic.xcarchive
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/MyClinic.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export "${auth[@]}" 2>&1 | tee -a ../build.log | grep -E "error:|EXPORT|Upload" || true
          grep -q "EXPORT SUCCEEDED\|Upload succeeded" ../build.log
          rm -f "$key"
      - name: Show compile errors as annotations
        if: failure()
        run: |
          .github/scripts/annotate-errors.sh build.log
          grep -E "error:" build.log | head -20 | sed 's/^/::error::/' || true

  # Starts the app on an Android emulator and fails if it crashes on launch.
  launch-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: my-clinic-debug-apk
          path: app-apk
      - uses: actions/download-artifact@v4
        with:
          name: my-clinic-release-apk
          path: release-apk
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The test build, then the shrunk/obfuscated release build (catches missing keep rules).
          script: .github/scripts/smoke-test.sh app-apk && adb uninstall com.myclinic.app && .github/scripts/smoke-test.sh release-apk
      - name: Upload device log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-test-log
          path: |
            logcat.txt
            screen.png
            ui.xml
          retention-days: 14
